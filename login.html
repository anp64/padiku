<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Padiku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-padiku">
        <div class="container">
            <a class="navbar-brand" href="index.html">Padiku</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="kategori.html">Kategori</a></li>
                    <li class="nav-item"><a class="nav-link" href="artikel.html">Artikel</a></li>
                    <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
                    <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="card login-card">
            <div id="alert-login" class="alert alert-danger" style="display: none;">
                email atau password tidak boleh.
            </div>
            <div class="card-body p-4">
                <h2>Login ke Padiku</h2>
                <form id="form-login">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="input-email" placeholder="nama@email.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="input-password" placeholder="Masukkan password">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="ingat">
                        <label class="form-check-label" for="ingat">Ingat saya</label>
                    </div>

                    <button type="submit" class="btn btn-padiku w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Belum punya akun? <a href="#">Daftar</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p class="mb-0">&copy; 2026 Padiku</p>
    </footer>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
